[package]
description = "copy of normalizer_glue for mozjs-sys"
links = "normalizer_glue"
repository = "https://github.com/servo/mozjs"
name = "mozjs_normalizer_glue"
version = "153.0.0"
edition = "2021"
license = "MPL-2.0"

[dependencies]
icu_normalizer = { package = "mozjs_icu_normalizer", version = "=153.0.0", path = "../icu_normalizer", default-features = false, features = ["serde", "utf16_iter", "latin1"] }
icu_provider_glue = { package = "mozjs_icu_provider_glue", version = "=153.0.0", path = "../icu_provider_glue" }
write16 = { version  = "1.0", features = ["smallvec"] }
smallvec = "1.9.0"
encoding_rs = "0.8"

[build-dependencies.cbindgen]
version = "0.29.4"
